<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="'JetBrains Mono','SF Mono','Consolas',monospace">
  <!--
    Écran principal du séchoir (ST7789 320x240 paysage), reconstruit vectoriellement
    depuis src/TftDisplay.cpp + include/TftDisplay.h + include/UiTheme.h.
    Couleurs = conversion RGB565 -> hex d'origine (commentaires du firmware).
    Etat représenté : phase BRASSAGE, ventilation ON, chauffage ON,
    registre d'extraction en cours d'ouverture (45%), recirculation fermée, ECO armé (hors fenêtre).

    Bandes espacées de 4px partout (progression et bandeau d'alerte affleurent
    les bords haut/bas, comme sur l'appareil réel) : header -> cartes -> bande
    hydraulique -> équipements -> bandeau, tous séparés du même intervalle.

    Groupes utiles pour l'animation :
      #progress-fill   largeur = avancement de phase (0..320)
      #fan-blades      rotation continue quand la ventilation tourne
      #clock-text      texte à faire défiler (HH:MM:SS)
      #phase-dot / #phase-label   couleur + libellé selon la phase
      #extr-icon, #extr-state     couleur ambre qui clignote pendant le mouvement
      #eco-badge       à masquer si le mode éco est désactivé
  -->
  <defs>
    <style>
      .bg        { fill:#0a1012; }
      .panel     { fill:#121b1d; }
      .panel-sunken { fill:#0e1618; }
      .border    { stroke:#1c2b2c; }
      .accent-dim{ fill:#1d4a45; }
      .c-danger  { fill:#ff5a5a; }
      .c-warn    { fill:#ffb020; }
      .c-ok      { fill:#5bd97f; }
      .c-neutral { fill:#5aa9e6; }
      .c-muted   { fill:#6f8a88; }
      .c-accent  { fill:#3fe6d4; }
      .c-text    { fill:#e9f4f2; }
      text { dominant-baseline:middle; }
      .lbl  { font-size:6.6px; font-weight:700; letter-spacing:.3px; }
      .val  { font-size:8px;   font-weight:700; }
      .cap  { font-size:8px;   font-weight:700; }
    </style>

    <!-- Ventilateur : moyeu + 4 pales, symétrie d'ordre 4 comme le sprite d'origine -->
    <g id="icon-fan-shape">
      <path d="M0,-1.2 C2.4,-3 4,-7.4 0,-10.6 C-4,-7.4 -2.4,-3 0,-1.2 Z"/>
      <path d="M0,-1.2 C2.4,-3 4,-7.4 0,-10.6 C-4,-7.4 -2.4,-3 0,-1.2 Z" transform="rotate(90)"/>
      <path d="M0,-1.2 C2.4,-3 4,-7.4 0,-10.6 C-4,-7.4 -2.4,-3 0,-1.2 Z" transform="rotate(180)"/>
      <path d="M0,-1.2 C2.4,-3 4,-7.4 0,-10.6 C-4,-7.4 -2.4,-3 0,-1.2 Z" transform="rotate(270)"/>
      <circle r="1.8"/>
    </g>

    <!-- Résistance électrique : éclair -->
    <path id="icon-heat-shape" d="M2,-9 L-5.4,1.6 L-1,1.6 L-2.6,9 L5.6,-1.8 L1,-1.8 Z"/>

    <!-- Extraction : flèche sortante (Material "call_made") — l'air quitte le circuit -->
    <symbol id="icon-extraction-shape" viewBox="0 0 24 24">
      <path d="M9,5v2h6.59L4,18.59L5.41,20L17,8.41V15h2V5H9z"/>
    </symbol>

    <!-- Recirculation : double flèche en boucle (Material "autorenew") — l'air reste dans le circuit -->
    <symbol id="icon-recycle-shape" viewBox="0 0 24 24">
      <path d="M12,4V1L8,5l4,4V6c3.31,0,6,2.69,6,6c0,1.01-0.25,1.97-0.7,2.8l1.46,1.46C19.54,15.03,20,13.57,20,12C20,7.58,16.42,4,12,4z M6,12c0-1.01,0.25-1.97,0.7-2.8L5.24,7.74C4.46,8.97,4,10.43,4,12c0,4.42,3.58,8,8,8v3l4-4l-4-4v3c-3.31,0-6-2.69-6-6z"/>
    </symbol>
  </defs>

  <!-- fond -->
  <rect class="bg" x="0" y="0" width="320" height="240"/>

  <!-- barre de progression (y 0..4), affleure le bord haut -->
  <g id="progress-bar">
    <rect class="panel-sunken" x="0" y="0" width="320" height="4"/>
    <rect id="progress-fill" class="c-accent" x="0" y="0" width="134" height="4"/>
  </g>

  <!-- en-tête (y 4..24) -->
  <g id="header">
    <rect class="panel-sunken" x="0" y="4" width="320" height="20"/>
    <line class="border" x1="0" y1="23.5" x2="320" y2="23.5" stroke-width="1"/>

    <circle id="phase-dot" class="c-accent" cx="9" cy="14" r="3"/>
    <text id="phase-label" class="lbl c-accent" x="17" y="15">BRASSAGE</text>

    <text id="clock-text" class="val c-text" x="160" y="15" text-anchor="middle">01:47:32</text>

    <g id="eco-badge">
      <text class="lbl c-ok" x="312" y="15" text-anchor="end">ECO</text>
    </g>
  </g>

  <!-- cartes (y 28..104) — 4px sous l'en-tête, comme chaque bande suivante -->
  <g id="cards">
    <g id="card-inlet">
      <rect class="panel" x="6" y="28" width="172" height="76" rx="5"/>
      <rect x="6" y="28" width="172" height="76" rx="5" fill="none" stroke="#1d4a45" stroke-width="1"/>
      <text class="cap c-accent" x="92" y="48" text-anchor="middle">INJECTION</text>
      <text id="inlet-figures" class="c-accent" x="92" y="84" text-anchor="middle" font-size="19" font-weight="700">51.2&#176; &#160;&#160;42%</text>
    </g>

    <g id="card-target">
      <rect class="panel" x="182" y="28" width="132" height="76" rx="5"/>
      <rect x="182" y="28" width="132" height="76" rx="5" fill="none" stroke="#1c2b2c" stroke-width="1"/>
      <text class="cap c-muted" x="248" y="48" text-anchor="middle">CONSIGNE</text>
      <text id="target-figures" class="c-text" x="248" y="84" text-anchor="middle" font-size="14" font-weight="700">55.0&#176; &#160;&#160;40%</text>
    </g>
  </g>

  <!-- bandeau hydraulique (y 108..142) -->
  <g id="strip">
    <g id="strip-hydraulic">
      <rect class="panel" x="6" y="108" width="100" height="34" rx="5"/>
      <rect x="6" y="108" width="100" height="34" rx="5" fill="none" stroke="#1c2b2c" stroke-width="1"/>
      <text class="lbl c-muted" x="56" y="119" text-anchor="middle">HYDRAULIQUE</text>
      <text id="hydraulic-state" class="val c-ok" x="56" y="132" text-anchor="middle">ON</text>
    </g>
    <g id="strip-water">
      <rect class="panel" x="110" y="108" width="100" height="34" rx="5"/>
      <rect x="110" y="108" width="100" height="34" rx="5" fill="none" stroke="#1c2b2c" stroke-width="1"/>
      <text class="lbl c-muted" x="160" y="119" text-anchor="middle">EAU CIRC.</text>
      <text id="water-temp" class="val c-neutral" x="160" y="132" text-anchor="middle">38.4&#176;</text>
    </g>
    <g id="strip-tank">
      <rect class="panel" x="214" y="108" width="100" height="34" rx="5"/>
      <rect x="214" y="108" width="100" height="34" rx="5" fill="none" stroke="#1c2b2c" stroke-width="1"/>
      <text class="lbl c-muted" x="264" y="119" text-anchor="middle">BALLON</text>
      <text id="tank-temp" class="val c-neutral" x="264" y="132" text-anchor="middle">61.2&#176;</text>
    </g>
  </g>

  <!-- rangée des équipements (y 146..218) -->
  <g id="devices">
    <!-- ventilation -->
    <g id="device-fan">
      <rect class="panel" x="6" y="146" width="74" height="72" rx="5"/>
      <rect x="6" y="146" width="74" height="72" rx="5" fill="none" stroke="#1c2b2c" stroke-width="1"/>
      <g id="fan-icon" class="c-ok" transform="translate(43 166)">
        <g id="fan-blades-spin">
          <use href="#icon-fan-shape"/>
        </g>
      </g>
      <text class="lbl c-muted" x="43" y="186" text-anchor="middle">VENTIL.</text>
      <text id="fan-state" class="val c-ok" x="43" y="206" text-anchor="middle">ON</text>
    </g>

    <!-- chauffage électrique -->
    <g id="device-heat">
      <rect class="panel" x="84" y="146" width="74" height="72" rx="5"/>
      <rect x="84" y="146" width="74" height="72" rx="5" fill="none" stroke="#1c2b2c" stroke-width="1"/>
      <use id="heat-icon" href="#icon-heat-shape" class="c-ok" transform="translate(121 166)"/>
      <text class="lbl c-muted" x="121" y="186" text-anchor="middle">CHAUFF.</text>
      <text id="heat-state" class="val c-ok" x="121" y="206" text-anchor="middle">ON</text>
    </g>

    <!-- registre d'extraction -->
    <g id="device-extraction">
      <rect class="panel" x="162" y="146" width="74" height="72" rx="5"/>
      <rect x="162" y="146" width="74" height="72" rx="5" fill="none" stroke="#1c2b2c" stroke-width="1"/>
      <use id="extr-icon" href="#icon-extraction-shape" class="c-warn" x="190" y="157" width="18" height="18"/>
      <text class="lbl c-muted" x="199" y="186" text-anchor="middle">EXTR.</text>
      <text id="extr-state" class="val c-warn" x="199" y="206" text-anchor="middle">OUV. 45%</text>
    </g>

    <!-- registre de recirculation -->
    <g id="device-recycle">
      <rect class="panel" x="240" y="146" width="74" height="72" rx="5"/>
      <rect x="240" y="146" width="74" height="72" rx="5" fill="none" stroke="#1c2b2c" stroke-width="1"/>
      <use id="recycle-icon" href="#icon-recycle-shape" class="c-neutral" x="268" y="157" width="18" height="18"/>
      <text class="lbl c-muted" x="277" y="186" text-anchor="middle">RECIRC.</text>
      <text id="recycle-state" class="val c-neutral" x="277" y="206" text-anchor="middle">FERME</text>
    </g>
  </g>

  <!-- bandeau d'alerte (y 222..240) — affleure le bord bas, vide par défaut sur le tableau de bord -->
  <g id="hint-bar">
    <rect class="panel-sunken" x="0" y="222" width="320" height="18"/>
    <line class="border" x1="0" y1="222.5" x2="320" y2="222.5" stroke-width="1"/>
    <text id="hint-text" class="lbl c-danger" x="160" y="231" text-anchor="middle" opacity="0"></text>
  </g>
</svg>
