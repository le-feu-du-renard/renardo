[platformio]
default_envs = pico

[env:native]
platform = native
; -I test/unit/support supplies the Arduino shim so the real domain classes
; compile on the host; Logger compiles away to no-ops when ARDUINO is undefined.
build_flags =
  -std=gnu++17
  -I test/unit/support
  -I include
test_build_src = no

[env:pico]
platform = raspberrypi
board = rpipico
framework = arduino
monitor_speed = 115200
board_build.filesystem_size = 512k
build_flags =
  -D CORE_DEBUG_LEVEL=5
  -std=gnu++17
  ; --- TFT_eSPI setup, declared here so the library in .pio stays untouched.
  ; The pins must match the TFT_*_PIN / SPI0_*_PIN macros in include/config.h.
  ; The panel owns SPI0 alone and is write-only, so MISO is not wired.
  ; TFT_MISO is left *undefined* rather than set to -1: the library tests it
  ; with #ifdef, so defining it at all makes it configure a receive pin.
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=19
  -D TFT_SCLK=18
  -D TFT_CS=16
  -D TFT_DC=17
  -D TFT_RST=20
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  ; This panel only answers with the clock idling LOW. TFT_eSPI forces
  ; SPI_MODE3 for ST7789 on the grounds that "some ST7789 boards do not work
  ; with Mode 0" — this one is the converse, and showed nothing at all on the
  ; library default. Found by bisecting with the tft_test environment.
  -D TFT_SPI_MODE=SPI_MODE0
  ; This panel wires its colour channels the other way round: on the library
  ; default, red came out blue and cyan came out yellow, with green unaffected
  ; — the signature of the red and blue channels being exchanged.
  -D TFT_RGB_ORDER=TFT_BGR
  ; Drop to 20000000 or 10000000 if the picture shows tearing or speckles on
  ; flying leads; short PCB traces should take 40 MHz.
  -D SPI_FREQUENCY=40000000
lib_deps =
  adafruit/Adafruit BusIO@^1.14.1
  adafruit/RTClib@^2.1.1
  thijse/ArduinoLog@^1.1.1
  4-20ma/ModbusMaster@^2.0.1
  bodmer/TFT_eSPI@^2.5.43
  jgromes/RadioLib@^7.1.2

; ============================================================================
; Bring-up helpers. Each has its own main() and is uploaded by hand, so they
; live in bringup/ rather than in src/: out of the way of the firmware build,
; which then needs no exclusion list at all. Their build_src_filter reaches
; out of src_dir with ../bringup/, and adds by name the production files the
; sketch drives — the point of each one is that it exercises the real code.
; ============================================================================

; Bring-up helper: drives the five display signals one at a time so each wire
; can be checked with a multimeter. No libraries, no TFT_eSPI — it proves the
; wiring, not the driver.
;   pio run -e pin_test -t upload -t monitor
[env:pin_test]
platform = raspberrypi
board = rpipico
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../bringup/pin_test/>
build_flags =
  -std=gnu++17

; Bring-up helper: reads the ST7789 back over the shared SDA line, then sweeps
; test patterns. The module has no MISO pin, so this is the only way to get an
; answer out of the panel and tell a dead one from a mis-driven one.
;   pio run -e tft_test -t upload -t monitor
[env:tft_test]
extends = env:pico
build_src_filter = -<*> +<../bringup/tft_test/>
build_flags =
  ${env:pico.build_flags}
  ; Turns the SDA pin around for reads; the ST7789 answers on it.
  -D TFT_SDA_READ=1
  ; Reads need a far slower clock than writes.
  -D SPI_READ_FREQUENCY=6000000

; Bring-up helper: reports every quadrature edge and every detent coming off the
; encoder, plus the debounced click. It compiles the production decoder, so what
; it prints is what the menu would see — with the raw edge counts added, which
; separate "not wired" from "wired but bouncing".
;   pio run -e encoder_test -t upload -t monitor
[env:encoder_test]
platform = raspberrypi
board = rpipico
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../bringup/encoder_test/> +<QuadratureDecoder.cpp>
build_flags =
  -std=gnu++17

; Bring-up helper: talks Modbus RTU to the probes over the MAX3485, driving the
; production Rs485Bus so a reading here is a reading the firmware would get. It
; adds what the bus hides — the receiver's idle level before any frame is sent,
; the raw bytes on the wire, and address/baud sweeps for a probe whose
; configuration is unknown.
;   pio run -e rs485_test -t upload -t monitor
[env:rs485_test]
platform = raspberrypi
board = rpipico
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../bringup/rs485_test/> +<Rs485Bus.cpp> +<Logger.cpp>
build_flags =
  -std=gnu++17
lib_deps =
  thijse/ArduinoLog@^1.1.1
  4-20ma/ModbusMaster@^2.0.1

; Bring-up helper: switches the air damper every 30 s and prints the position
; feedback next to it, so the GPIO, the BC337 stage, the relay, the Belimo and
; the feedback wire are all checked in one pass. It compiles the production
; OutputDriver and AirDamper, so the polarity applied and the percentage shown
; are the firmware's own — with the boot idle level of the command pin and the
; raw ADC added, which separate "not wired" from "wired the wrong way round".
;   pio run -e damper_test -t upload -t monitor
[env:damper_test]
platform = raspberrypi
board = rpipico
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../bringup/damper_test/> +<AirDamper.cpp> +<OutputDriver.cpp> +<Logger.cpp>
build_flags =
  -std=gnu++17
lib_deps =
  thijse/ArduinoLog@^1.1.1
