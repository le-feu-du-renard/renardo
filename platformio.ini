[platformio]
default_envs = pico

[env:native]
platform = native
; -I test/unit/support supplies the Arduino shim so the real domain classes
; compile on the host; Logger compiles away to no-ops when ARDUINO is undefined.
build_flags =
  -std=gnu++17
  -I test/unit/support
  -I include
test_build_src = no

[env:pico]
platform = raspberrypi
board = rpipico
framework = arduino
monitor_speed = 115200
board_build.filesystem_size = 512k
build_src_filter = +<*> -<pin_test/>
build_flags =
  -D CORE_DEBUG_LEVEL=5
  -std=gnu++17
  ; --- TFT_eSPI setup, declared here so the library in .pio stays untouched.
  ; The pins must match the TFT_*_PIN / SPI0_*_PIN macros in include/config.h.
  ; The panel owns SPI0 alone and is write-only, so MISO is not wired.
  ; TFT_MISO is left *undefined* rather than set to -1: the library tests it
  ; with #ifdef, so defining it at all makes it configure a receive pin.
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=19
  -D TFT_SCLK=18
  -D TFT_CS=17
  -D TFT_DC=20
  -D TFT_RST=21
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D SPI_FREQUENCY=40000000
lib_deps =
  adafruit/Adafruit BusIO@^1.14.1
  adafruit/RTClib@^2.1.1
  thijse/ArduinoLog@^1.1.1
  4-20ma/ModbusMaster@^2.0.1
  bodmer/TFT_eSPI@^2.5.43
  jgromes/RadioLib@^7.1.2

; Bring-up helper: drives the five display signals one at a time so each wire
; can be checked with a multimeter. No libraries, no TFT_eSPI — it proves the
; wiring, not the driver.
;   pio run -e pin_test -t upload -t monitor
[env:pin_test]
platform = raspberrypi
board = rpipico
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<pin_test/>
build_flags =
  -std=gnu++17
